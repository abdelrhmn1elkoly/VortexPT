<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Minimalist White Live Stressing Anchor -->
  <!-- Tendon strand entering -->
  <line x1="4" y1="24" x2="20" y2="24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Conical Trumpet Casting -->
  <polygon points="18,17 34,13 34,35 18,31" fill="rgba(255,255,255,0.18)" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Bearing Plate -->
  <line x1="34" y1="9" x2="34" y2="39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Wedges split -->
  <polygon points="28,20 34,18 34,23 28,22" fill="#FFFFFF"/>
  <polygon points="28,26 34,25 34,30 28,28" fill="#FFFFFF"/>
  <!-- Stressing pull arrow -->
  <polyline points="40,19 45,24 40,29" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>