<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Concrete Soffit Baseline -->
  <line x1="4" y1="42" x2="44" y2="42" stroke="#6B7280" stroke-width="2.5"/>
  <!-- Wire Chair Legs -->
  <polyline points="10,42 16,20 32,20 38,42" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chair Cross-tie -->
  <line x1="14" y1="31" x2="34" y2="31" stroke="#3B82F6" stroke-width="2"/>
  <!-- Flat Duct Cradle at Top -->
  <rect x="14" y="12" width="20" height="8" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Strands inside Duct -->
  <circle cx="18" cy="16" r="1.5" fill="#FFFFFF"/>
  <circle cx="24" cy="16" r="1.5" fill="#FFFFFF"/>
  <circle cx="30" cy="16" r="1.5" fill="#FFFFFF"/>
  <!-- Height Dimension Arrow -->
  <line x1="42" y1="42" x2="42" y2="16" stroke="#10B981" stroke-width="1.5"/>
  <polyline points="39,20 42,16 45,20" fill="none" stroke="#10B981" stroke-width="1.5"/>
</svg>