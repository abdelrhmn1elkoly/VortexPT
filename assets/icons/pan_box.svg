<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Top Slab Edge Line -->
  <line x1="4" y1="10" x2="44" y2="10" stroke="#9CA3AF" stroke-width="2"/>
  <!-- Stepped Pocket Former (Pan Box Cavity) -->
  <polygon points="12,10 12,34 36,34 36,10 44,10 44,40 4,40 4,10" fill="#181818" stroke="#374151" stroke-width="1.5"/>
  <rect x="14" y="12" width="20" height="20" rx="2" fill="#064E3B" stroke="url(#boxGrad)" stroke-width="2"/>
  <!-- Tendon Entering Through Back of Pocket -->
  <line x1="2" y1="26" x2="14" y2="26" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- Internal Live Anchor inside Pan Box -->
  <polygon points="16,21 24,19 24,33 16,31" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
  <!-- Wedge Cavity inside Pan Box -->
  <circle cx="20" cy="26" r="2" fill="#FFFFFF"/>
  <!-- Grout / Access Arrow -->
  <path d="M 24,6 L 24,16 M 21,13 L 24,16 L 27,13" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>