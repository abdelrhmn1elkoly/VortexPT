<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="deadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Encapsulation Shell / Concrete Boundary -->
  <rect x="6" y="8" width="36" height="32" rx="6" fill="#1E1E1E" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Tendon Strand Entering -->
  <line x1="4" y1="24" x2="16" y2="24" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- Swaged Retention Bearing Plate -->
  <rect x="16" y="12" width="5" height="24" rx="1.5" fill="url(#plateGrad)" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Dead End Bulb / Swaged Anchor Sleeve -->
  <rect x="21" y="16" width="10" height="16" rx="2" fill="url(#deadGrad)" stroke="#7F1D1D" stroke-width="1.5"/>
  <!-- Dead End Onion / Bulb Strand Loop Fan -->
  <path d="M 31,19 C 37,17 40,20 40,24 C 40,28 37,31 31,29 Z" fill="#F87171" stroke="#991B1B" stroke-width="1.2"/>
  <!-- Anchor Retention Springs / Bars -->
  <line x1="24" y1="13" x2="24" y2="35" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Blind Anchor Lock Glyph -->
  <circle cx="26" cy="24" r="2.5" fill="#FFFFFF"/>
</svg>